name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]  # ← nama workflow build-docker kamu yang sudah ada
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH ke EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.236.150.30 
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            # Set variabel
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REPO_NAME=$(echo "pso-final-library-management" | tr '[:upper:]' '[:lower:]')
            REPO_URL="https://github.com/$REPO_OWNER/$REPO_NAME.git"
            REPO_PATH="/home/ubuntu/$REPO_NAME"
            IMAGE_NAME="ghcr.io/$REPO_OWNER/$REPO_NAME:latest"
            CONTAINER_NAME="laravel-app"
            
            # Step 1: Clone atau Pull repo terbaru
            if [ -d "$REPO_PATH" ]; then
              echo "📦 Repository exists, pulling latest changes..."
              cd "$REPO_PATH"
              git pull origin main
            else
              echo "📦 Cloning repository..."
              git clone "$REPO_URL" "$REPO_PATH"
              cd "$REPO_PATH"
            fi
            
            # Step 1b: Create .env file (hardcoded - ensures it's always present)
            echo "📝 Creating .env file..."
            tee /home/ubuntu/.env > /dev/null << 'EOF'
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=base64:NiKY3YELiZkusNKH2/ERzksMB5jGppefFv//VFNcW4o=
            APP_DEBUG=false
            APP_URL=http://3.236.150.30
            LOG_CHANNEL=stack
            LOG_DEPRECATIONS_CHANNEL=null
            LOG_LEVEL=debug
            DB_CONNECTION=pgsql
            DB_HOST=terraform-20251202201953247500000001.cij6cyq6ii19.us-east-1.rds.amazonaws.com
            DB_PORT=5432
            DB_DATABASE=library_db
            DB_USERNAME=postgres
            DB_PASSWORD=swagpapi101
            BROADCAST_DRIVER=log
            CACHE_DRIVER=file
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=sync
            SESSION_DRIVER=file
            SESSION_LIFETIME=120
            MEMCACHED_HOST=127.0.0.1
            REDIS_HOST=127.0.0.1
            REDIS_PASSWORD=null
            REDIS_PORT=6379
            MAIL_MAILER=smtp
            MAIL_HOST=mailpit
            MAIL_PORT=1025
            MAIL_USERNAME=null
            MAIL_PASSWORD=null
            MAIL_ENCRYPTION=null
            MAIL_FROM_ADDRESS="hello@example.com"
            MAIL_FROM_NAME="Laravel"
            AWS_ACCESS_KEY_ID=
            AWS_SECRET_ACCESS_KEY=
            AWS_DEFAULT_REGION=us-east-1
            AWS_BUCKET=
            AWS_USE_PATH_STYLE_ENDPOINT=false
            EOF
            chmod 644 /home/ubuntu/.env
            echo "✅ .env file created successfully"
            
            # Step 2: Login ke GHCR
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Step 3: Pull image terbaru
            echo "📥 Pulling latest Docker image..."
            docker pull "$IMAGE_NAME"
            
            # Step 4: Stop dan remove container lama
            echo "🛑 Stopping old container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
            
            # Step 5: Run container baru dengan image terbaru
            echo "🚀 Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p 80:80 \
              -p 443:443 \
              -v /home/ubuntu/.env:/var/www/html/.env:ro \
              -e APP_ENV=production \
              -e APP_DEBUG=false \
              "$IMAGE_NAME"
            
            # Wait for container to start
            sleep 5
            
            # Step 5b: Run Laravel setup commands
            echo "⚙️  Running Laravel setup commands..."
            docker exec "$CONTAINER_NAME" php artisan cache:clear || true
            docker exec "$CONTAINER_NAME" php artisan config:clear || true
            docker exec "$CONTAINER_NAME" chmod -R 775 /var/www/html/storage || true
            
            # Step 6: Cleanup
            echo "🧹 Cleaning up old images..."
            docker system prune -af --volumes
            
            # Step 7: Verify
            echo "✅ Deployment complete!"
            docker ps | grep "$CONTAINER_NAME"
            echo "🎉 New feature should be live at http://3.236.150.30"