name: Build & Push Docker Image

# Ini yang bener: nunggu workflow laravel-tests selesai & sukses dulu
on:
  workflow_run:
    workflows: ["laravel-tests"]   # ← nama workflow testing kamu
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    # KALAU TEST GAGAL → job ini otomatis ga jalan (skipped)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repo to lowercase
        id: lowercase_repo
        run: |
          echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.lowercase_repo.outputs.repo }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Success!
        run: |
          echo "✅ Docker image successfully pushed to GHCR!"
          echo "Image: ghcr.io/${{ steps.lowercase_repo.outputs.repo }}:latest"